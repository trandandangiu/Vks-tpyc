services:
  postgres:
    image: postgres:16-alpine
    container_name: ptcv_postgres
    restart: always
    environment:
      POSTGRES_DB: ptcv_db
      POSTGRES_USER: ptcv_app
      POSTGRES_PASSWORD: PTCV@2026Strong!
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5435:5432"
    volumes:
      - ptcv_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptcv_app -d ptcv_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: ptcv_adminer
    restart: always
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  ptcv_postgres_data: